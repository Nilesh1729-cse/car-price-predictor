<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Car Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="bg-dark">

    <div class="container">
      <div class="row justify-content-center">
        <div class="card mt-5" style="width: 100%; height: 100%;">

          <div class="card-header text-center">
            <h1>Welcome to Car Price Predictor</h1>
          </div>

          <div class="card-body">
            <form method="post" accept-charset="utf-8">

              <div class="col-12 text-center mb-3">
                <label class="form-label"><b>Select Company:</b></label>
                <select class="form-select" id="company" name="company" required onchange="load_car_models(this.id, 'car_model')">
                  <option value="" disabled selected>Select Company</option>
                  {% for company in companies %}
                    <option value="{{ company }}">{{ company }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12 text-center mb-3">
                <label class="form-label"><b>Select Model:</b></label>
                <select class="form-select" id="car_model" name="car_model" required>
                  <option value="" disabled selected>Select Model</option>
                </select>
              </div>

              <div class="col-12 text-center mb-3">
                <label class="form-label"><b>Select Year of Purchase:</b></label>
                <select class="form-select" id="year" name="year" required>
                  <option value="" disabled selected>Select Year</option>
                  {% for year in years %}
                    <option value="{{ year }}">{{ year }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12 text-center mb-3">
                <label class="form-label"><b>Select Fuel Type:</b></label>
                <select class="form-select" id="fuel_type" name="fuel_type" required>
                  <option value="" disabled selected>Select Fuel Type</option>
                  {% for fuel in fuel_types %}
                    <option value="{{ fuel }}">{{ fuel }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12 text-center mb-3">
                <label class="form-label"><b>Select Number of Kms travelled:</b></label>
                <input class="form-control" type="number" id="kilo_driven" name="kilo_driven" placeholder="Enter no. of Kms travelled" required>
              </div>

              <div class="col-12 text-center mt-4">
                <button type="button" class="btn btn-primary form-control" onclick="send_data()">Predict Price</button>
              </div>

            </form>
            <br>
            <div class="row">
              <div class="col-12 text-center">
                <h3><span id="prediction"></span></h3>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script>
      function load_car_models(company_id, car_model_id) {
        var company = document.getElementById(company_id);
        var car_model = document.getElementById(car_model_id);

        car_model.value = "";
        car_model.innerHTML = "<option value='' disabled selected>Select Model</option>";

        {% for company in companies %}
            if (company.value == "{{ company }}") {
              {% for model in car_models %}
                {% if company in model %}
                    var newOption = document.createElement("option");
                    newOption.value = "{{ model }}";
                    newOption.innerHTML = "{{ model }}";
                    car_model.options.add(newOption);
                {% endif %}
              {% endfor %}
            }
        {% endfor %}
      }

      function form_handler(event) {
        event.preventDefault();
      }

      function send_data() {
        document.querySelector('form').addEventListener('submit', form_handler);

        var fd = new FormData(document.querySelector('form'));
        var xhr = new XMLHttpRequest();

        xhr.open('POST', '/predict', true);
        document.getElementById("prediction").innerHTML = "Wait! Predicting Price...";

        xhr.onreadystatechange = function() {
          if (xhr.readyState == XMLHttpRequest.DONE) {
            document.getElementById("prediction").innerHTML = "Prediction: ₹" + xhr.responseText;
          }
        };

        xhr.send(fd);
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
